<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // Removes .html from the address bar
  if (window.location.pathname.endsWith('.html')) {
    const cleanUrl = window.location.pathname.replace(/\.html$/, '');
    window.history.replaceState(null, '', cleanUrl + window.location.search);
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pou Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4e8c1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    h2 {
      color: #5c3a21;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #8b5a2b;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #6a4420;
    }

    .toggle-text {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }

    .toggle-text a {
      color: #8b5a2b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Pou Login</h2>
    
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit">Log In</button>
    </form>

    <div class="toggle-text">
      Need an account? <a href="./signup.html">Create one</a>
      <br><br>
      <a href="./index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;

      // Fetch saved account from localStorage
      const savedUser = localStorage.getItem('pouUser_' + usernameInput);

      if (!savedUser) {
        alert('User not found! Check your username or sign up.');
        return;
      }

      const userData = JSON.parse(savedUser);

      // Verify password
      if (userData.password === passwordInput) {
        // Save current logged-in session state
        localStorage.setItem('currentUser', JSON.stringify(userData));
        alert('Welcome back, ' + userData.username + '!');
        window.location.href = './index.html';
      } else {
        alert('Incorrect password!');
      }
    });
  </script>
<a href="./forgot-password.html">Forgot Password?</a>
  
</body>
</html>
