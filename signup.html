<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // Removes .html from the address bar
  if (window.location.pathname.endsWith('.html')) {
    const cleanUrl = window.location.pathname.replace(/\.html$/, '');
    window.history.replaceState(null, '', cleanUrl + window.location.search);
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pou - Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4e8c1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    h2 {
      color: #5c3a21;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #8b5a2b;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #6a4420;
    }

    .toggle-text {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }

    .toggle-text a {
      color: #8b5a2b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Create Pou Account</h2>
    
    <form id="signup-form">
      <div class="form-group">
        <label for="new-username">Username</label>
        <input type="text" id="new-username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label for="new-email">Email</label>
        <input type="email" id="new-email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="new-password">Password</label>
        <input type="password" id="new-password" placeholder="Create a password" required>
      </div>

      <button type="submit">Sign Up</button>
    </form>

    <div class="toggle-text">
      Already have an account? <a href="./login.html">Log In</a>
      <br><br>
      <a href="./index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById('signup-form');

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Stop page from refreshing

      const username = document.getElementById('new-username').value;
      const email = document.getElementById('new-email').value;
      const password = document.getElementById('new-password').value;

      // Save user data object into localStorage
      const userData = { username, email, password };
      localStorage.setItem('pouUser_' + username, JSON.stringify(userData));

      alert('Account created successfully! Please log in.');
      window.location.href = './login.html';
    });
  </script>
</body>
</html>
